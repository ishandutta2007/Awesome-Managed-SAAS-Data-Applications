<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .metric-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #f1f5f9;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748b;
    }

    /* Ambient Pulsing Particles and Glowing Orbs */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 5; fill-opacity: 0.8; }
      50% { r: 8; fill-opacity: 1; }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 1050px 80px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate;
      transform-origin: 150px 300px;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    .stream-line {
      stroke-dasharray: 12, 12;
      animation: dashStream 25s linear infinite;
    }
    .live-node {
      animation: nodePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated / Dynamic Flow Lines & Nodes (Positioned carefully in background) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 0 120 C 350 40, 750 220, 1200 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 0 240 C 400 320, 800 160, 1200 280" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="stream-line" d="M 150 0 C 300 180, 900 150, 1050 360" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Glowing background orbs -->
  <circle class="pulsing-orb-1" cx="1060" cy="90" r="140" fill="#38bdf8" opacity="0.18" filter="url(#glow)" />
  <circle class="pulsing-orb-2" cx="120" cy="280" r="160" fill="#818cf8" opacity="0.15" filter="url(#glow)" />
  <circle class="pulsing-orb-1" cx="600" cy="340" r="100" fill="#c084fc" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic floating particles -->
  <circle class="particle-1" cx="220" cy="70" r="3.5" fill="#38bdf8" />
  <circle class="particle-2" cx="980" cy="240" r="4.5" fill="#818cf8" />
  <circle class="particle-3" cx="1110" cy="150" r="3" fill="#c084fc" />
  <circle class="particle-1" cx="130" cy="180" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="620" cy="40" r="4" fill="#38bdf8" />

  <!-- Banner Header Category Tag -->
  <g transform="translate(60, 48)">
    <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" class="live-node" />
    <text x="30" y="19" class="badge-text">CURATED ECOSYSTEM</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Guaranteed high-contrast & unobstructed) -->
  <g transform="translate(60, 128)">
    <text class="title-text">
      Managed SaaS <tspan fill="url(#accentGrad)">Data Applications</tspan>
    </text>
    <text y="42" class="subtitle-text">
      Enterprise Cloud Marketplaces, Certified Ecosystems &amp; Self-Hosted Open-Source Platforms
    </text>
  </g>

  <!-- Dynamic Status / Metric Cards at Bottom -->
  <!-- Card 1 -->
  <g transform="translate(60, 225)">
    <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <rect x="14" y="15" width="44" height="44" rx="10" fill="#38bdf8" fill-opacity="0.15" />
    <text x="36" y="43" font-size="22" text-anchor="middle">☁️</text>
    <text x="70" y="38" class="metric-title">Enterprise SaaS</text>
    <text x="70" y="55" class="metric-sub">Snowflake • Salesforce • SAP</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(325, 225)">
    <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <rect x="14" y="15" width="44" height="44" rx="10" fill="#818cf8" fill-opacity="0.15" />
    <text x="36" y="43" font-size="22" text-anchor="middle">⚡</text>
    <text x="70" y="38" class="metric-title">App Marketplaces</text>
    <text x="70" y="55" class="metric-sub">Certified Packages &amp; Integrations</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(590, 225)">
    <rect width="240" height="74" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <rect x="14" y="15" width="44" height="44" rx="10" fill="#c084fc" fill-opacity="0.15" />
    <text x="36" y="43" font-size="22" text-anchor="middle">🔓</text>
    <text x="70" y="38" class="metric-title">Open Source</text>
    <text x="70" y="55" class="metric-sub">Self-Hosted &amp; Git-Native</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(855, 225)">
    <rect width="285" height="74" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
    <rect x="14" y="15" width="44" height="44" rx="10" fill="#34d399" fill-opacity="0.15" />
    <text x="36" y="43" font-size="22" text-anchor="middle">📊</text>
    <text x="70" y="38" class="metric-title">$465B+ Sector Size</text>
    <text x="70" y="55" class="metric-sub">Moderately Concentrated Ecosystems</text>
  </g>
</svg>
